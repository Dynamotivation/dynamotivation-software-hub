[alias]
xtask = "run --package xtask --quiet --"

[env]
# Oldest macOS version the release binaries support.
MACOSX_DEPLOYMENT_TARGET = "11.0"

# Static CRT: Windows MSVC builds run without the VC++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Linux ARM64 cross-compilation from x86_64 Linux: install gcc-aarch64-linux-gnu and set
# CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc (not set here so native
# ARM64 builds keep using the default linker).
