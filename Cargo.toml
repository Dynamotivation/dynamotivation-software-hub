[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/ui",
    "apps/desktop",
    "xtask",
]
# `cargo run` / `cargo build` without `-p` target the desktop app.
default-members = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92" # Slint 1.18 MSRV
authors = ["Dynamotivation"]
publish = false
# license: undecided (see AGENTS.md -> Open decisions)

[workspace.metadata.release]
product-name = "Dynamotivation Software Hub"
identifier = "com.dynamotivation.softwarehub"
publisher = "Dynamotivation"
binary = "dynamotivation-software-hub"

[workspace.dependencies]
hub-domain = { path = "crates/domain" }
hub-application = { path = "crates/application" }
hub-infrastructure = { path = "crates/infrastructure" }
hub-ui = { path = "crates/ui" }

slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "image-default-formats"] }
slint-build = "1.18.1"
directories = "6"
rust-ini = "0.21"
cargo_metadata = "0.23"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# Faster local iteration on the heavy UI dependencies.
[profile.dev.package."*"]
opt-level = 2
