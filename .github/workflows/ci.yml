name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  version:
    name: Version increment
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version gate
        run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Require a release version increase
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/check_version.py

  # Analyze and test every workspace member on Linux (cheap, fast).
  check:
    name: Check ${{ matrix.member }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        member:
          - packages/hub_core
          - packages/hub_images
          - packages/hub_keys
          - packages/hub_l10n
          - packages/hub_scroll
          - apps/windows
          - apps/macos
          - apps/ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
        working-directory: ${{ matrix.member }}
      - run: flutter test
        working-directory: ${{ matrix.member }}

  windows-installer:
    name: Signed Windows installer (Linux)
    if: github.event_name != 'pull_request'
    needs: [version, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree,mshtml=
      WINEPREFIX: ${{ github.workspace }}/build/windows-toolchain/wine
      WINDOWS_SYSROOT: ${{ github.workspace }}/build/windows-toolchain/sysroot
    steps:
      - uses: actions/checkout@v4
      - name: Require signing credentials
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          test -n "$SIGNING_CERT_PFX_BASE64" || { echo 'Missing signing certificate'; exit 1; }
          test -n "$SIGNING_CERT_PASSWORD" || { echo 'Missing signing password'; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux cross-compilation and packaging tools
        run: bash installer/linux/setup.sh
      - name: Cross-compile Windows app on Linux
        run: xvfb-run -a python3 installer/linux/build_windows.py
      - name: Sign binaries and compile signed Inno Setup on Linux
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: xvfb-run -a python3 installer/linux/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: software-hub-installer
          path: |
            dist/Dynamotivation-Software-Hub-Setup-*.exe
            dist/Dynamotivation-Software-Hub-Setup-*.exe.sha256
          if-no-files-found: error

  release:
    name: Publish signed Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, check, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: software-hub-installer
          path: dist
      - name: Tag this main commit and publish the signed setup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash ci/publish_release.sh
