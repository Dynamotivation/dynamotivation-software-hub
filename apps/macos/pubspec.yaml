publish_to: 'none'

version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  hub_core: any
  hub_l10n: any
  hub_keys: any
  hub_scroll: any
  hub_images: any

  cupertino_icons: ^2.0.0
