name: dynamotivation_software_hub_ubuntu
description: "Dynamotivation Software Hub, Ubuntu frontend (Yaru & Ubuntu HIG look)"
publish_to: 'none'

version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  hub_core: any
  hub_l10n: any
  hub_keys: any
  hub_scroll: any

  yaru: ^11.0.0
  yaru_window_manager: ^0.1.0
  window_manager: ^0.5.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
