name: dynamotivation_software_hub
description: "Dynamotivation Software Hub desktop application in Flutter"
publish_to: 'none'

version: 0.1.3+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  hub_core: any
  hub_l10n: any
  hub_keys: any
  hub_scroll: any
  hub_images: any

  fluent_ui: ^4.17.0
  window_manager: ^0.5.2
  flutter_svg: ^2.3.0
  local_notifier: ^0.1.6
  system_tray: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
