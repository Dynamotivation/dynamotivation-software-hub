name: dynamotivation_software_hub
description: "Dynamotivation Software Hub desktop application in Flutter"
publish_to: 'none'

version: 0.1.13+1
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  hub_core: any
  hub_l10n: any
  hub_keys: any
  hub_scroll: any
  hub_images: any

  fluent_ui: ^4.17.0
  window_manager: ^0.5.2
  package_info_plus: ^8.3.0
  flutter_svg: ^2.3.0
  # Windows-only toasts (WinRT, with images). Deliberately not the cross-platform
  # flutter_local_notifications package: no other frontend uses it yet.
  flutter_local_notifications_windows: ^3.1.1
  system_tray: ^2.0.3
  ffi: ^2.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/
